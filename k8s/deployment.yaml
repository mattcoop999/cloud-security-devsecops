apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-security-devsecops-demo
  namespace: devsecops-demo
  labels:
    app: cloud-security-devsecops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-security-devsecops-demo
  template:
    metadata:
      labels:
        app: cloud-security-devsecops-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/tek-giant/cloud-security-devsecops-enablement:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secret-placeholder
                  key: API_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
