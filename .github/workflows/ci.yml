name: DevSecOps Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  security-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies
        run: pip install -r app/requirements.txt

      - name: Run unit tests
        working-directory: app
        run: pytest -q

      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit -r app/requirements.txt

      - name: Build container image
        run: docker build -t cloud-security-devsecops-demo:${{ github.sha }} ./app

      - name: Container vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cloud-security-devsecops-demo:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init without backend
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Security baseline policy checks
        run: python policies/check_security_baseline.py
